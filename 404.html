<!doctype html>
<html lang="en">
<head>

<style>

  body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 16px; box-sizing: border-box;
    font: 18px/1.6 "Public Sans", -apple-system, sans-serif; color: var(--fg); background: var(--bg); }
  img { width: 96px; height: 96px; }
  h1 { font-size: 36px; margin: 16px 0 8px; }
  p { color: var(--muted); margin: 0 0 20px; }
  a { color: var(--accent); font-weight: 600; text-underline-offset: 3px; }
